name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  worker:
    name: Worker artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches worker version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./apps/worker/package.json').version")"
      - run: pnpm release:worker
      - name: Attest worker archive
        uses: actions/attest@v4
        with:
          subject-path: release/*.tar.gz
      - name: Publish immutable worker artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes

  server-image:
    name: Server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable server image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ghcr.io/${{ github.repository }}/server:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/server:${{ github.sha }}
      - name: Attest server image provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/server
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
