name: SindralAI
options:
  xcodeVersion: "26.0"
  bundleIdPrefix: ai.sindral
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: "WNT9BWAKYX"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
configs:
  Debug: debug
  Staging: debug
  Release: release
schemes:
  SindralAI Staging:
    build:
      targets:
        SindralAI: all
    run:
      config: Staging
    test:
      config: Staging
      targets:
        - SindralAITests
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging
    management:
      shared: true
      orderHint: 1
targets:
  SindralAI:
    type: application
    platform: iOS
    sources:
      - path: SindralAI
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.sindral.app
        PRODUCT_NAME: SindralAI
        INFOPLIST_FILE: SindralAI/Info.plist
        CODE_SIGN_ENTITLEMENTS: SindralAI/SindralAI.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - SindralAITests
  SindralAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SindralAITests
    dependencies:
      - target: SindralAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.sindral.app.tests
        GENERATE_INFOPLIST_FILE: YES
