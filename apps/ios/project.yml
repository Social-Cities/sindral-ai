name: SindralAI
options:
  bundleIdPrefix: ai.sindral
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
configs:
  Debug: debug
  Release: release
targets:
  SindralAI:
    type: application
    platform: iOS
    sources:
      - path: SindralAI
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.sindral.ios
        PRODUCT_NAME: SindralAI
        INFOPLIST_FILE: SindralAI/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - SindralAITests
  SindralAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SindralAITests
    dependencies:
      - target: SindralAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.sindral.ios.tests
        GENERATE_INFOPLIST_FILE: YES
