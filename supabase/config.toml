project_id = "sindral-ai"

# Ports are deliberately offset from the Supabase CLI defaults (54321-54323) so a
# Sindral stack can run alongside another local Supabase project without clashing.
# Keep these in sync with .env.example and the README.

[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 55322
major_version = 17

[studio]
enabled = true
port = 55323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://localhost:8787/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# Local only: skip the confirmation email so `pnpm smoke` and manual testing can
# sign up without a mail round trip. Hosted projects keep confirmations enabled.
enable_confirmations = false

# Services Sindral does not use. Disabled so `supabase start` is fast and lean.
[local_smtp]
enabled = false

[analytics]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false
